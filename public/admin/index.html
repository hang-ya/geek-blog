<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>GEEK — 内容管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .gate {
      text-align: center;
      padding: 40px;
      max-width: 360px;
      width: 100%;
    }
    .gate h1 {
      font-family: "JetBrains Mono", monospace;
      font-size: 24px;
      color: #58a6ff;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .gate p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
    .gate input {
      width: 100%;
      padding: 12px 16px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 15px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .gate input:focus { border-color: #58a6ff; }
    .gate button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .gate button:hover { background: #2ea043; }
    .gate .error { color: #f85149; font-size: 13px; margin-top: 12px; display: none; }
    .gate .hint { margin-top: 16px; font-size: 12px; color: #484f58; }
  </style>
</head>
<body>
  <!-- Password gate -->
  <div id="gate" class="gate">
    <h1>GEEK</h1>
    <p>内容管理系统</p>
    <input type="password" id="pw" placeholder="输入密码" autofocus />
    <button onclick="verify()">验证</button>
    <p id="error" class="error"></p>
    <p class="hint">仅限管理员访问</p>
  </div>

  <!-- CMS mount (hidden until verified) -->
  <div id="nc-root" style="display:none"></div>

  <script>
    const OAUTH = 'https://geek-oauth.3585770584.workers.dev';

    // Check if already verified this session
    if (sessionStorage.getItem('admin_ok') === '1') {
      loadCMS();
    }

    async function verify() {
      const pw = document.getElementById('pw').value;
      const err = document.getElementById('error');
      if (!pw) return;

      try {
        const res = await fetch(OAUTH + '/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        const data = await res.json();
        if (data.ok) {
          sessionStorage.setItem('admin_ok', '1');
          loadCMS();
        } else {
          err.textContent = '密码错误';
          err.style.display = 'block';
          document.getElementById('pw').value = '';
          document.getElementById('pw').focus();
        }
      } catch (e) {
        err.textContent = '验证服务不可用，请稍后重试';
        err.style.display = 'block';
      }
    }

    function loadCMS() {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('nc-root').style.display = '';
      // Load Decap CMS
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(s);
    }

    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verify();
    });
  </script>
</body>
</html>
