<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>GEEK — 内容管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; }

    #gate {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; justify-content: center; align-items: center;
      background: #0d1117; color: #e6edf3;
      -webkit-font-smoothing: antialiased;
    }
    #gate.done { display: none; }

    .gate-box { text-align: center; padding: 40px; max-width: 360px; width: 100%; }
    .gate-box h1 { font-family: "JetBrains Mono", monospace; font-size: 24px; color: #58a6ff; letter-spacing: 0.15em; margin-bottom: 8px; }
    .gate-box p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
    .gate-box input {
      width: 100%; padding: 12px 16px;
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      color: #e6edf3; font-size: 15px; text-align: center; letter-spacing: 4px;
      outline: none; transition: border-color 0.2s;
    }
    .gate-box input:focus { border-color: #58a6ff; }
    .gate-box button {
      width: 100%; margin-top: 12px; padding: 12px;
      background: #238636; border: none; border-radius: 8px;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .gate-box button:hover { background: #2ea043; }
    .gate-box .error { color: #f85149; font-size: 13px; margin-top: 12px; display: none; }
    .gate-box .hint { margin-top: 16px; font-size: 12px; color: #484f58; }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <div id="gate">
    <div class="gate-box">
      <h1>GEEK</h1>
      <p>内容管理系统</p>
      <input type="password" id="pw" placeholder="输入密码" autofocus />
      <button onclick="verify()">验证</button>
      <p id="error" class="error"></p>
      <p class="hint">仅限管理员访问</p>
    </div>
  </div>

  <script>
    // Stop Decap CMS from auto-initializing
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var OAUTH = 'https://geek-oauth.3585770584.workers.dev';

    if (sessionStorage.getItem('admin_ok') === '1') {
      initCMS();
    }

    async function verify() {
      var pw = document.getElementById('pw').value;
      var err = document.getElementById('error');
      if (!pw) return;

      try {
        var res = await fetch(OAUTH + '/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        var data = await res.json();
        if (data.ok) {
          sessionStorage.setItem('admin_ok', '1');
          document.getElementById('gate').className = 'done';
          initCMS();
        } else {
          err.textContent = '密码错误';
          err.style.display = 'block';
          document.getElementById('pw').value = '';
          document.getElementById('pw').focus();
        }
      } catch (e) {
        err.textContent = '验证服务不可用';
        err.style.display = 'block';
      }
    }

    function initCMS() {
      document.getElementById('gate').className = 'done';
      if (!window._cmsInited) {
        window._cmsInited = true;
        window.CMS.init();
        injectRefresh();
        autoFillSlug();
      }
    }

    // Auto-fill slug field with random safe value when creating a new post
    function autoFillSlug() {
      var timer = setInterval(function() {
        var inputs = document.querySelectorAll('input[type="text"]');
        for (var i = 0; i < inputs.length; i++) {
          var input = inputs[i];
          // Find the slug field by its placeholder or nearby label
          var parent = input.closest('[class*="field"]') || input.parentNode;
          if (!parent) continue;
          var label = parent.querySelector('label');
          if (label && label.textContent.includes('自定义链接') && !input.dataset.slugReady) {
            input.dataset.slugReady = '1';
            // Auto-fill only if empty (new post)
            if (!input.value || input.value.trim() === '') {
              input.value = Math.random().toString(36).substring(2, 8);
            }
            // Mark as auto-generated so user can edit
            input.placeholder = input.value || 'auto-generated';
          }
        }
      }, 800);
      setTimeout(function() { clearInterval(timer); }, 30000);
    }

    // Add refresh button next to relation widgets
    function injectRefresh() {
      var timer = setInterval(function() {
        // Find all field labels in the editor
        var labels = document.querySelectorAll('label');
        for (var i = 0; i < labels.length; i++) {
          var label = labels[i];
          if (!label.textContent) continue;
          // Match relation fields that need refresh (所属合集, 文章列表)
          if ((label.textContent.includes('所属合集') || label.textContent.includes('文章列表'))
              && !label.parentNode.querySelector('.cms-refresh-btn')) {
            var btn = document.createElement('button');
            btn.className = 'cms-refresh-btn';
            btn.textContent = '🔄';
            btn.title = '刷新列表（新建合集/文章后点此更新下拉选项）';
            btn.style.cssText =
              'margin-left:6px;padding:0 6px;background:none;border:1px solid #30363d;' +
              'border-radius:4px;color:#8b949e;cursor:pointer;font-size:14px;line-height:22px;';
            btn.onmouseenter = function() { this.style.color = '#58a6ff'; this.style.borderColor = '#58a6ff'; };
            btn.onmouseleave = function() { this.style.color = '#8b949e'; this.style.borderColor = '#30363d'; };
            btn.onclick = function(e) {
              e.preventDefault();
              e.stopPropagation();
              // Reload page — browser will warn if there are unsaved changes
              location.reload();
            };
            label.appendChild(btn);
          }
        }
      }, 600);
      // Stop looking after 60s
      setTimeout(function() { clearInterval(timer); }, 60000);
    }

    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verify();
    });
  </script>
</body>
</html>
