backend:
  name: github
  repo: hang-ya/geek-blog
  branch: main
  base_url: https://geek-oauth.3585770584.workers.dev

media_folder: "public/images"
public_folder: "/images"

site_url: https://geek.tzyday.com
display_url: geek.tzyday.com
logo_url: https://geek.tzyday.com/favicon.ico

locale: zh_Hans

editor:
  preview: true

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}"
    editor:
      preview: true
    fields:
      - label: "标题"
        name: title
        widget: string
        hint: "文章标题（支持中文）"
      - label: "日期"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "摘要"
        name: description
        widget: text
        hint: "一句话描述文章内容，会显示在首页列表"
      - label: "封面图"
        name: cover
        widget: image
        required: false
        hint: "文章封面图片，显示在首页和文章顶部"
      - label: "标签"
        name: tags
        widget: list
        default: ["随笔"]
        hint: "按回车添加标签，如：技术、阅读、工具"
      - label: "所属合集"
        name: series
        widget: relation
        collection: collections
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        required: false
        hint: "搜索并选择合集。输入合集名称关键词来搜索"
      - label: "草稿"
        name: draft
        widget: boolean
        default: false
        required: false
        hint: "草稿不会在网站上显示"
      - label: "正文"
        name: body
        widget: markdown
        hint: "Markdown 格式，支持代码块、图片、表格等"

  - name: "collections"
    label: "合集"
    label_singular: "合集"
    folder: "content/collections"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - label: "标题"
        name: title
        widget: string
        hint: "合集名称（支持中文），如「前端入门系列」"
      - label: "URL Slug"
        name: slug
        widget: string
        hint: "英文短标识，如 frontend-intro。用于网址，不要用中文"
        pattern: ["^[a-zA-Z0-9_-]+$", "只能使用英文、数字、- 和 _"]
      - label: "描述"
        name: description
        widget: text
        hint: "简单介绍这个合集的内容"
      - label: "日期"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "封面图"
        name: cover
        widget: image
        required: false
        hint: "可选，合集的封面图片"
      - label: "草稿"
        name: draft
        widget: boolean
        default: false
        required: false
